# ==============================================
# HD-Manager Development Docker Compose
# ==============================================
# Use this file for local development with Docker
#
# IMPORTANT: Before first run, create external volumes:
#   docker volume create mongodb_data
#   docker volume create mongodb_config
#   docker volume create uploads
#
# These volumes will persist even after 'docker-compose down'

services:
  # ============================================
  # Backend Server - Python/Flask Application
  # ============================================
  backend-server:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Server Configuration
      - PORT=${PORT:-5000}
      - DEBUG=${DEBUG:-True}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://localhost}

      # Security - from .env file
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key}
      - API_KEY=${API_KEY}

      # Database
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb-server:27017/hd-manager}

      # File Uploads
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
      - UPLOAD_ALLOWED_EXTENSIONS=${UPLOAD_ALLOWED_EXTENSIONS:-pdf,doc,docx,xls,xlsx,txt,png,jpg,jpeg,gif}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_REQUESTS=${LOG_REQUESTS:-false}

      # Health Monitoring
      - DB_HEALTH_CHECK_INTERVAL=${DB_HEALTH_CHECK_INTERVAL:-5}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - hd-network

  # ============================================
  # Nginx Frontend - Static Files Server (HTTPS)
  # ============================================
  nginx-front:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        - SYSTEM_NAME=Flow Task
        - API_URL=/api
        - SOCKET_TIMEOUT=10000
        - IDLE_TIMEOUT=300000
    container_name: frontend
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # These are injected at runtime by frontend-entrypoint.sh
      - SYSTEM_NAME=Flow Task11
      - API_URL=/api
      - API_MAX_RETRIES=2
      - API_RETRY_DELAY=500
      - SOCKET_TIMEOUT=10000
      - IDLE_TIMEOUT=300000
      # External System URLs - default values for local development
      - SERVICENOW_URL=https://servicenow.com
      - MARS_URL=https://mars-system.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ca:/etc/nginx/ssl:ro
    depends_on:
      - backend-server
    networks:
      - hd-network

  # ============================================
  # MongoDB - Database Server
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb-server
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - hd-network

# ============================================
# Networks
# ============================================
networks:
  hd-network:
    driver: bridge

# ============================================
# Volumes - External (persist after docker-compose down)
# ============================================
# Create these volumes before first run:
#   docker volume create mongodb_data
#   docker volume create mongodb_config
#   docker volume create uploads
# ============================================
volumes:
  mongodb_data:
    external: true
  mongodb_config:
    external: true
  uploads:
    external: true
