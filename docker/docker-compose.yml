# ==============================================
# HD-Manager Development Docker Compose
# ==============================================
# Use this file for local development with Docker
#
# IMPORTANT: Before first run, create external volumes:
#   docker volume create mongodb_data
#   docker volume create mongodb_config
#   docker volume create uploads
#
# These volumes will persist even after 'docker-compose down'

services:
  # ============================================
  # Backend Server - Python/Flask Application
  # ============================================
  backend-server:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=True
      - CORS_ORIGINS=http://localhost,https://localhost
      - MAX_FILE_SIZE_MB=10
      - LOG_LEVEL=INFO
      - UPLOAD_ALLOWED_EXTENSIONS=pdf,doc,docx,xls,xlsx,txt,png,jpg,jpeg,gif
      - MONGO_URI=mongodb://mongodb-server:27017/hd-manager
      - JWT_SECRET_KEY=8f3b2c9d1e4a5f6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - hd-network

  # ============================================
  # Nginx Frontend - Static Files Server (HTTPS)
  # ============================================
  nginx-front:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        - VITE_SYSTEM_NAME=Flow Task
        - VITE_API_URL=/api
        - VITE_SOCKET_TIMEOUT=10000
        - VITE_IDLE_TIMEOUT=300000
    container_name: frontend
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # These are injected at runtime by frontend-entrypoint.sh
      - VITE_SYSTEM_NAME=Flow Task11
      - VITE_API_URL=/api
      - VITE_API_MAX_RETRIES=2
      - VITE_API_RETRY_DELAY=500
      - VITE_SOCKET_TIMEOUT=10000
      - VITE_IDLE_TIMEOUT=300000
      # External System URLs - default values for local development
      - SERVICENOW_URL=https://servicenow.com
      - MARS_URL=https://mars-system.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ca:/etc/nginx/ssl:ro
    depends_on:
      - backend-server
    networks:
      - hd-network

  # ============================================
  # MongoDB - Database Server
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb-server
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - hd-network

# ============================================
# Networks
# ============================================
networks:
  hd-network:
    driver: bridge

# ============================================
# Volumes - External (persist after docker-compose down)
# ============================================
# Create these volumes before first run:
#   docker volume create mongodb_data
#   docker volume create mongodb_config
#   docker volume create uploads
# ============================================
volumes:
  mongodb_data:
    external: true
  mongodb_config:
    external: true
  uploads:
    external: true
