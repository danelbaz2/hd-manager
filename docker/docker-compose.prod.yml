# ==============================================
# HD-Manager Production Docker Compose
# ==============================================
# Use this file on the Linux VM after loading images
#
# IMPORTANT: Before first run, create external volumes:
#   docker volume create mongodb_data
#   docker volume create mongodb_config
#   docker volume create uploads
#
# SETUP: Edit the environment variables below before deploying!
# ==============================================

services:
  # ============================================
  # Backend Server - Python/Flask Application
  # ============================================
  backend-server:
    image: hd-manager-backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # ===========================================
      # SERVER CONFIGURATION
      # ===========================================
      - PORT=5000
      - DEBUG=False
      
      # CORS allowed origins - UPDATE WITH YOUR SERVER IP!
      - CORS_ORIGINS=https://192.168.80.5,https://flow-task

      # ===========================================
      # SECURITY - GENERATE NEW SECRETS!
      # ===========================================
      # Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
      - SECRET_KEY=CHANGE_ME_generate_with_python_secrets_token_hex_32
      
      # Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
      - JWT_SECRET_KEY=CHANGE_ME_generate_with_python_secrets_token_hex_32
      
      # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - ADMIN_API_KEY=CHANGE_ME_generate_with_python_secrets_token_urlsafe_32
      
      # Optional API key for external tools (leave empty to disable)
      - API_KEY=

      # ===========================================
      # DATABASE
      # ===========================================
      - MONGO_URI=mongodb://mongodb-server:27017/hd-manager

      # ===========================================
      # FILE UPLOADS
      # ===========================================
      - MAX_FILE_SIZE_MB=10
      - UPLOAD_ALLOWED_EXTENSIONS=pdf,doc,docx,xls,xlsx,txt,png,jpg,jpeg,gif

      # ===========================================
      # LOGGING
      # ===========================================
      - LOG_LEVEL=INFO
      - LOG_REQUESTS=false
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - hd-network

  # ============================================
  # Nginx Frontend - Static Files Server (HTTPS)
  # ============================================
  nginx-front:
    image: hd-manager-frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # ===========================================
      # FRONTEND CONFIGURATION
      # ===========================================
      - SYSTEM_NAME=Flow Task
      - API_URL=/api
      - API_MAX_RETRIES=2
      - API_RETRY_DELAY=500
      - SOCKET_TIMEOUT=10000
      - IDLE_TIMEOUT=300000
      
      # ===========================================
      # EXTERNAL SYSTEM URLS - UPDATE FOR YOUR ENVIRONMENT
      # ===========================================
      - SERVICENOW_URL=https://your-servicenow-instance.com
      - MARS_URL=https://your-mars-instance.com
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ca:/etc/nginx/ssl:ro
    depends_on:
      - backend-server
    networks:
      - hd-network

  # ============================================
  # MongoDB - Database Server
  # ============================================
  mongodb:
    image: mongo:4.4
    container_name: mongodb-server
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - hd-network

# ============================================
# Networks
# ============================================
networks:
  hd-network:
    driver: bridge

# ============================================
# Volumes - External (persist after docker-compose down)
# ============================================
# Create these volumes before first run:
#   docker volume create mongodb_data
#   docker volume create mongodb_config
#   docker volume create uploads
# ============================================
volumes:
  mongodb_data:
    external: true
  mongodb_config:
    external: true
  uploads:
    external: true
