# ==============================================
# HD-Manager Production Docker Compose
# ==============================================
# Use this file on the Linux VM after loading images

services:
  # ============================================
  # Backend Server - Python/Flask Application
  # ============================================
  backend-server:
    image: hd-manager-backend:latest
    container_name: hd-backend-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=False
      - CORS_ORIGINS=https://192.168.80.5,https://flow-task
      - MAX_FILE_SIZE_MB=10
      - LOG_LEVEL=INFO
      - UPLOAD_ALLOWED_EXTENSIONS=pdf,doc,docx,xls,xlsx,txt,png,jpg,jpeg,gif
      - MONGO_URI=mongodb://mongodb:27017/hd-manager
      - SECRET_KEY=8f3b2c9d1e4a5f6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
      - JWT_SECRET_KEY=8f3b2c9d1e4a5f6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - hd-network

  # ============================================
  # Nginx Frontend - Static Files Server (HTTPS)
  # ============================================
  nginx-front:
    image: hd-manager-frontend:latest
    container_name: hd-nginx-front
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # =============================================
      # CHANGE THESE VALUES FOR YOUR PRODUCTION ENV!
      # =============================================
      - VITE_SYSTEM_NAME=Flow Task1123
      - VITE_API_URL=/api
      - VITE_API_MAX_RETRIES=2
      - VITE_API_RETRY_DELAY=500
      - VITE_SOCKET_TIMEOUT=10000
      - VITE_IDLE_TIMEOUT=300000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ca:/etc/nginx/ssl:ro
    depends_on:
      - backend-server
    networks:
      - hd-network

  # ============================================
  # MongoDB - Database Server
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: hd-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - hd-network

# ============================================
# Networks
# ============================================
networks:
  hd-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_uploads:
    driver: local
